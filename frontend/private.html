<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chats</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
</head>
<body>
  <div class="animated-overlay"></div>
 
<div id="app">
<div id="topbar-container"></div> 
<div id="bottom-bar"></div>
<!-- 👶 Baby AI Floating Button -->
  <div id="backBtnb" class="backbtnb innerbtn">
<i class="fa-solid fa-user-group"></i><small>Friends</small>  </div>
</div>
  <main id="private-container">
    <!-- CARD LIST VIEW -->
    <section id="chat-list-view">
      <h2>Private Threads</h2>
      <div id="chat-list">
        <p style='text-align:center; color:#888;'>No friends yet. Add some <a href='friends.html'> friends</a> to start chatting! 👥</p>
      </div>
    </section>

    <!-- CHAT VIEW (hidden by default) -->
    <section id="chat-view" style="display: none;">
      <header class="chat-header">
        <button id="backBtn">← Back</button>
        <h3 id="chat-username">Chat with John Doe</h3>
      </header>

      <div id="chat-messages">
        <!-- Example bubbles -->
        <div class="bubble you">Hey John 👋</div>
        <div class="bubble them">Hi! How are you?</div>
      </div>

      <form id="chat-input-area">
        <textarea id="chatInput" placeholder="Type a message..." rows="1" ></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
    </div>
  </main>
  
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="js/topbar.js" defer></script>
<script src="js/topbar-loader.js"></script>
  <script src="js/private.js"></script>
</body>
</html>
