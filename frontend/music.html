<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Faith Music</title>
  <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">

  <link rel="stylesheet" href="css/style.css">
  <style>
    * { box-sizing: border-box; }
    html,body { height:100%; }
    body {
      margin: 0;
      padding: 20px;
      font-family: var(--font);
      background: var(--bg-color);
      color: var(--text-color);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    h1 { margin: 0 0 18px 0; font-size: 1.4rem; letter-spacing: -0.5px; }

    #app {
      max-width: 1100px;
      margin: 0 auto;
      display: block;
    }
  </style>
</head>
<body>
 <div class="animated-overlay"></div>
<div id="app">
<div id="topbar-container"></div>
<div id="bottom-bar"></div>

    <h1>Faith Music</h1>

    <!-- YOUTUBE SEARCH SECTION -->
    <div style="margin-bottom:30px; padding:20px;">
      <h3 style="margin-top:0;">🔍 Search YouTube Music</h3>
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input id="youtubeSearchInput" type="text" placeholder="Search for songs, artists, hymns..." style="flex:1; padding:10px 15px; border:1px solid var(--accent); border-radius:8px; background:var(--bg-color); color:var(--text-color); font-family:inherit; font-size:0.95rem;">
        <button id="youtubeSearchBtn" style="padding:10px 20px; background:var(--accent); color:var(--button-text); border:none; border-radius:8px; cursor:pointer; font-weight:600; min-width:100px;">Search</button>
      </div>
      <div id="youtubeResults" style="display:none;">
        <h4 style="margin-top:0;">Search Results</h4>
        <div id="youtubeResultsList" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
      <div id="youtubeLoading" style="display:none; text-align:center; color:var(--text-color); opacity:0.7;">
        Searching...
      </div>
    </div>

    <!-- CATEGORIES GRID -->
    <div id="categoriesWrap" class="categories">
      <!-- cards inserted here -->
    </div>

    <!-- PLAYLIST VIEW -->
    <div id="playlistView" class="playlist-view">
      <div class="playlist-card" id="playlistCard">
        <div class="playlist-header">
          <div class="cat-heading" id="playlistTitle">Category</div>
          <div style="display:flex; gap:8px; align-items:center;">
            <button id="backToCats" class="back-btn">← Categories</button>
          </div>
        </div>

        <div class="song-list" id="songList">
          <!-- songs inserted here -->
        </div>
      </div>
    </div>

    <!-- PLAYER OVERLAY -->
    <div id="playerOverlay" class="player-overlay" aria-hidden="true" style="display:none;">
      <div class="player-box" role="dialog" aria-modal="true" style="max-height:85vh; overflow-y:auto;">
        <div class="player-top">
          <div>
            <div id="playerTitle" style="font-weight:700"></div>
            <div id="playerArtist" style="font-size:0.9rem;color:var(--text-color);opacity:0.7;"></div>
          </div>
          <div>
            <button id="closePlayer" class="close-player">Close</button>
          </div>
        </div>

        <!-- VIDEO AREA -->
        <div id="overlayVideo" style="display:none;">
          <div id="yt-player"></div>
          <iframe id="sc-iframe" style="width:100%;border:0;display:none;" scrolling="no" allow="autoplay"></iframe>
        </div>

        <!-- AUDIO AREA -->
        <div id="overlayAudio" style="display:none;">
          <iframe id="audioIframe" style="width:100%; height:120px; border:0;" allow="autoplay"></iframe>
          <audio id="overlayAudioEl" controls style="width:100%; display:none;"></audio>
        </div>

        <!-- lyrics -->
        <div id="overlayLyrics" style="margin-top:10px; font-size:0.95rem; color:var(--verse-color); max-height:300px; overflow:auto; line-height:1.6;">
          <!-- lyrics go here -->
        </div>
      </div>
    </div>

    <!-- PLAYLISTS SIDEBAR -->
    <div id="playlistsSidebar" style="margin-top:40px; padding:20px; background:var(--bg-color); border-radius:12px; border:1px solid var(--accent);">
      <h2 style="margin-top:0;">📚 My Playlists</h2>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <input id="newPlaylistName" type="text" placeholder="New playlist name..." style="flex:1; padding:8px 12px; border:1px solid var(--accent); border-radius:6px; font-family:inherit; background:var(--bg-color); color:var(--text-color);">
        <button id="createPlaylistBtn" class="hymn-btn" style="padding:8px 16px;">Create</button>
      </div>
      <div id="playlistsList" style="display:flex; flex-direction:column; gap:12px;">
        <!-- User playlists listed here -->
      </div>
    </div>

    <!-- VIEW PLAYLIST MODAL -->
    <div id="viewPlaylistModal" style="display:none; margin-top:40px; padding:20px; background:var(--bg-color); border-radius:12px; border:2px solid var(--accent);">
      <h2 id="viewPlaylistTitle" style="margin-top:0;"></h2>
      <div id="viewPlaylistSongs" style="display:flex; flex-direction:column; gap:10px;">
        <!-- Songs in playlist -->
      </div>
      <button id="closeViewPlaylist" class="hymn-btn" style="margin-top:15px; width:100%;">Close</button>
    </div>
  </div>
<script src="js/modal-utils.js"></script>
<script src="js/topbar.js" defer></script>
<script src="js/topbar-loader.js"></script>
  <script src="js/music.js"></script>
</body>
</html>
