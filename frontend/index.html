<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/style.css" />
  

</head>
<body>
<div id="loading-screen">
    <div class="loading-logo">
      <img src="/icons/icon.png" alt="App Logo" />
    </div>

    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>

    <p class="loading-text" id="loadingText">Preparing your space...</p>
  </div>

  <div class="animated-overlay"></div>
  <div id="app">
    <div id="topbar-container"></div>
    <!-- 👋 Welcome -->
    <section class="hero">
      <h2 id="welcomeText">👋 Welcome back!</h2>
      <p>Verse of the day:</p><p id="dailyVerse">Verse of the day loading...</p>
    </section>

    <!-- 🟣 Main Navigation Cards -->
    <section class="main-cards">
      <div class="card" data-link="home.html">
      <div class="box">
        <h3 class="intro">QnA</h3>
        <p class="form" id="qnaInfo">Loading...</p>
      </div>
      </div>
      <div class="card" data-link="notes.html">
      <div class="box">
        <h3 class="intro">Notes</h3>
        <p class="form" id="notesInfo">Loading...</p>
      </div>
      </div>
      <div class="card" data-link="prayer.html">
      <div class="box">
        <h3 class="intro">Prayer</h3>
        <p class="form" id="prayerInfo">Loading...</p>
      </div>
      </div>
      <div class="card" data-link="bible.html">
      <div class="box">
        <h3 class="intro">Bible</h3>
        <p class="form" id="bibleInfo">Loading...</p>
      </div>
      </div>
      <div class="card" data-link="community.html">
      <div class="box">
        <h3 class="intro">Community</h3>
        <p class="form" id="communityInfo">Loading...</p>
        <p class="form" id="commInfo"></p>
      </div>
      </div>

      <div class="card" data-link="private.html">
      <div class="box">
        <h3 class="intro">Chat</h3>
        <p class="form" id="chatInfo">Loading...</p>
        <p class="form" id="chatInfo"></p>
      </div>
      </div>
    </section>

    <!-- 🌟 Highlights -->
    <section class="highlights">
      <h3>Highlights</h3>
      <div id="highlightFeed" class="highlight-strip"></div>
    </section>

    

  </div>
  <div id="installPrompt">
  <div class="install-toast">
    <button class="innerbtn close-btnm">✕</button>
    <span>Install Holyverse for offline access</span>
    <br>
    <button id="installButton" class="install-btn">Install</button>
  </div>
</div>




  <script src="js/topbar.js" defer></script>
  <script src="js/topbar-loader.js"></script>
  <script src="js/home.js"></script>
  
</body>
</html>
