<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="HolyVerse splash">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#70d9f0"/>
            <stop offset="50%" stop-color="#00a6f0"/>
            <stop offset="100%" stop-color="#3ac3c3"/>
        </linearGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="url(#bgGrad)" />

    <!-- central emblem -->
    <g transform="translate(512,360)">
        <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.08"/>
        <circle cx="0" cy="0" r="70" fill="#ffffff" filter="url(#softGlow)"/>
        <g transform="translate(-10,-6) scale(1)">
            <path d="M-24 6 C-24 -18 24 -18 24 6 C24 20 -24 20 -24 6 Z" fill="#00a6f0"/>
            <circle cx="0" cy="-8" r="10" fill="#70d9f0"/>
        </g>
    </g>

    <!-- App name -->
    <text x="50%" y="560" dominant-baseline="middle" text-anchor="middle" fill="#05314a" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="48" font-weight="700">HolyVerse</text>

    <!-- Loading dots -->
    <g transform="translate(512,660)" aria-hidden="true">
        <circle cx="-36" cy="0" r="10" fill="#ffffff" opacity="0.75">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.2s" repeatCount="indefinite" begin="0s" />
        </circle>
        <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.75">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
        </circle>
        <circle cx="36" cy="0" r="10" fill="#ffffff" opacity="0.75">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.2s" repeatCount="indefinite" begin="0.4s" />
        </circle>
    </g>

    <!-- subtle bottom wave -->
    <path d="M0 820 C200 760 824 880 1024 820 L1024 1024 L0 1024 Z" fill="#ffffff" opacity="0.04" />

</svg>
