<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
 <div class="animated-overlay"></div>

<div id="topbar-container"></div>

  <main class="profile-page">
    <div id="profile-infos">
    <div class="profile-header">
      <img src="images/default-avatar.png" alt="Profile Picture" class="profile-pic">
      <div class="profile-info">
        <h2 id="topbar-user">Guest</h2>
        <p id="profileBio">This is the bio section. You can edit it later.</p>
      </div>
    </div>

    <div class="profile-stats">


      <p><strong>Joined:</strong> <span id="profileJoined">August 2025</span></p>
    </div>

    <div class="profile-actions">
      <button class="auth-btn" onclick="edit()">Edit Profile</button>
      <button id="logoutBtn" class="auth-btn">Log Out</button>
    </div>
</div>
    
<form id="profileForm" class="hidden">
    <h2>Profile</h2>
  <label>Username:</label>
  <input class="profile-input" type="text" id="username"><br>

  <label>Bio:</label>
<textarea class="profile-input" id="bio" placeholder="Write something about yourself..."></textarea><br>


  <label>Password (new):</label>
  <input class="profile-input" type="password" id="password"><br>

  <label>Profile Picture:</label>
<input class="profile-input" type="file" id="profilePic" accept="image/*"><br>
<img id="previewPic" src="images/default-avatar.png" alt="Preview" style="width:80px;height:80px;border-radius:50%;">


  <button class="auth-btn" type="submit">Update</button>
</form>
<p id="msg"></p>

  </main>

<div id="tree-section">
  
  <div class="tree-container">
    <img id="treeImage" src="backgrounds/seedling.png" alt="Your Tree">
    <div class="sparkles" id="sparkles"></div>
    <img id="wateringCan" src="backgrounds/jug.png" alt="Watering Can">
  </div>
<button id="waterBtn" class="innerbtn">💧 Water Tree</button>
  <p id="waterCount"></p>  

</div>

<!-- Milestones Section -->
<section class="milestones-section" style="margin-top: 48px;">
  <h2>🏆 Your Milestones</h2>
  <div id="milestonesContainer" class="milestones-grid">
    <!-- Dynamically populated by profile.js -->
  </div>
</section>

<!-- Border Selector Section -->
<section class="border-selector-section" style="margin-top: 32px; text-align: center;">
  <h3 style="margin-bottom: 16px;">🎨 Profile Border</h3>
  <p style="margin-bottom: 16px; opacity: 0.8; font-size: 0.9rem;">Choose your profile border (only borders you've earned)</p>
  <div id="borderOptions" class="border-options" style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 16px;">
    <!-- Dynamically populated -->
  </div>
</section>

<!-- Delete Account Section -->
<section class="delete-account-section" style="margin-top: 48px; text-align: center;">
  <button id="deleteAccountBtn" class="auth-btn" style="background-color: #e74c3c; margin-bottom: 24px;">🗑️ Delete Account</button>
</section>

  <script src="js/topbar.js" defer></script>
<script src="js/topbar-loader.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
