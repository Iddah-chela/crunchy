<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="animated-overlay"></div>
  
  <div id="app">
    <div id="topbar-container"></div>
    
    <main class="admin-dashboard">
      <h1>🛡️ Admin Dashboard</h1>
      
      <!-- Navigation Tabs -->
      <nav class="admin-tabs">
        <button class="tab-btn active" data-tab="questions" onclick="switchAdminTab('questions', this)">Pending Questions</button>
        <button class="tab-btn" data-tab="testimonies" onclick="switchAdminTab('testimonies', this)">Pending Testimonies</button>
        <button class="tab-btn" data-tab="reports" onclick="switchAdminTab('reports', this)">Reports</button>
        <button class="tab-btn" data-tab="push" onclick="switchAdminTab('push', this)">Push Test</button>
      </nav>
      
      <!-- Questions Tab -->
      <div id="questionsTab" class="admin-tab-content active">
        <section class="admin-section">
          <h2>User-Submitted Questions</h2>
          <div id="pendingQuestions" class="admin-list">
            <!-- Populated dynamically -->
          </div>
        </section>
      </div>
      
      <!-- Testimonies Tab -->
      <div id="testimoniesTab" class="admin-tab-content">
        <section class="admin-section">
          <h2>Pending Testimonies</h2>
          <div id="pendingTestimonies" class="admin-list">
            <!-- Populated dynamically -->
          </div>
        </section>
      </div>
      
      <!-- Reports Tab -->
      <div id="reportsTab" class="admin-tab-content">
        <section class="admin-section">
          <h2>Content Reports</h2>
          <div id="pendingReports" class="admin-list">
            <!-- Populated dynamically -->
          </div>
        </section>
      </div>

      <!-- Push Test Tab -->
      <div id="pushTab" class="admin-tab-content">
        <section class="admin-section">
          <h2>Push Notification Tester</h2>
          <div style="max-width:620px;">
            <p>Send a test push to a stored user or a raw device token.</p>
            <label>User ID (optional):</label>
            <input type="number" id="pushTestUserId" placeholder="123" />
            <label>Or Token (optional):</label>
            <input type="text" id="pushTestToken" placeholder="FCM_TOKEN_HERE" />
            <label>Title:</label>
            <input type="text" id="pushTestTitle" value="Test Notification" />
            <label>Body:</label>
            <input type="text" id="pushTestBody" value="This is a test push" />
            <div style="margin-top:8px;">
              <button class="innerbtn approve-btn" id="sendPushTestBtn">Send Test Push</button>
            </div>
            <div id="pushTestResult" style="margin-top:10px;color:var(--text-color);opacity:0.9"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  
  <script src="js/admin-auth.js"></script>
  <script src="js/topbar.js" defer></script>
  <script src="js/topbar-loader.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
